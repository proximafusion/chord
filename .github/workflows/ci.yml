name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install build tool
        run: python -m pip install build
      - name: Build wheel and source archive
        run: python -m build
      - name: Install built wheel and test tools
        run: python -m pip install 'dist/chord-0.1.0-py3-none-any.whl[dev,toy]'
      - name: Check installed imports outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from chord.experiments.frontfill import archive, prepared_utils"
      - name: Lint
        run: python -m ruff check chord tools conftest.py
      - name: Check formatting
        run: python -m ruff format --check chord tools conftest.py
      - name: Type check
        if: matrix.python-version == '3.12'
        run: python -m pyright
      - name: Offline tests and release checks
        run: python -m pytest -q

  simulator:
    name: ConStellaration 0.2.6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Update system package index
        run: sudo apt-get update
      - name: Install simulator build prerequisites
        run: sudo apt-get install -y build-essential cmake libnetcdf-dev
      - name: Install simulator and tests
        run: python -m pip install '.[dev,toy,stellarator]'
      - name: Verify simulator version
        run: python -c "from importlib import metadata; from chord import evaluate; assert metadata.version('constellaration') == '0.2.6'; assert evaluate.constellaration_available()"
      - name: Simulator interface tests
        run: python -m pytest -q chord/evaluate_test.py chord/experiments/frontfill/augment_test.py
